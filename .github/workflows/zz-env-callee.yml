name: ZZ Env Callee
on:
  workflow_call:
env:
  RS_PUB_KEY: "${{ secrets.RS_PUB_KEY }}"
  RENDEZVOUS_SERVER: "${{ secrets.RENDEZVOUS_SERVER }}"
  API_SERVER: "${{ secrets.API_SERVER }}"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report env lengths only
        run: |
          echo "RENDEZVOUS_SERVER_len=${#RENDEZVOUS_SERVER}"
          echo "RS_PUB_KEY_len=${#RS_PUB_KEY}"
          echo "API_SERVER_len=${#API_SERVER}"
